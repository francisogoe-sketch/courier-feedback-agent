<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T1 SB CSAT — Gold Courier Feedback Intelligence (CA & UK)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f5; --card-bg: #ffffff; --text: #1a2332; --text-secondary: #5a6a7e;
  --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.08); --radius: 12px;
  --navy: #1e3a5f; --red: #e74c3c; --green: #27ae60; --teal: #16a085;
  --purple: #8e44ad; --blue: #2980b9; --orange: #e67e22; --gray: #7f8c8d;
  --hover-bg: #f7f8fa; --table-header: #1e3a5f; --table-row-alt: #f8f9fb;
}
[data-theme="dark"] {
  --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0b0;
  --border: #2a2a4a; --shadow: 0 1px 3px rgba(0,0,0,.3); --shadow-lg: 0 4px 12px rgba(0,0,0,.3);
  --hover-bg: #1e2a4a; --table-header: #0f1929; --table-row-alt: #1a2340;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  transition: background .2s, color .2s;
}

/* HEADER */
.header { background: var(--card-bg); padding: 16px 24px; border-bottom: 1px solid var(--border); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
.header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.header h1 { font-size: 18px; font-weight: 700; color: var(--navy); }
[data-theme="dark"] .header h1 { color: #7ab8d6; }
.header-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-secondary); }
.header-meta strong { color: var(--text); font-weight: 600; }

/* CONTROLS */
.controls {
  background: var(--card-bg); padding: 12px 24px; display: flex; align-items: center;
  gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border);
}
.control-group { display: flex; align-items: center; gap: 6px; }
.control-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
select, button, input[type="date"], input[type="text"] {
  font-family: inherit; font-size: 13px; padding: 7px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--card-bg); color: var(--text);
  cursor: pointer; transition: all .15s;
}
select:hover, button:hover { border-color: var(--blue); background: var(--hover-bg); }
button:disabled { opacity: .4; cursor: not-allowed; }
input[type="text"]:focus, input[type="date"]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(41,128,185,.15); }
.btn-primary { background: var(--navy); color: #fff; border: none; }
[data-theme="dark"] .btn-primary { background: #2a4a6a; }
.btn-primary:hover { background: #2a4a6a; }
[data-theme="dark"] .btn-primary:hover { background: #3a5a7a; }
.btn-download { font-size: 12px; padding: 6px 12px; }
.checkbox-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.checkbox-wrap input { width: 16px; height: 16px; cursor: pointer; }
.icon-btn {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg);
  cursor: pointer; font-size: 16px; transition: all .15s;
}
.icon-btn:hover { border-color: var(--blue); background: var(--hover-bg); }
.icon-btn.clear-btn { font-size: 14px; color: var(--red); }
.courier-input-wrap { position: relative; display: flex; align-items: center; }
.courier-input-wrap input { width: 200px; padding-right: 28px; }
.courier-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; color: var(--text-secondary); border: none; background: none; padding: 0; }
.custom-range { display: flex; align-items: center; gap: 6px; }

/* MAIN LAYOUT — FULL WIDTH */
.main { padding: 20px 24px; width: 100%; }
.section { margin-bottom: 20px; }

/* SUMMARY CARDS */
.cards-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
@media (max-width: 1200px) { .cards-row { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 800px) { .cards-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .cards-row { grid-template-columns: 1fr; } }
.kpi-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); border-top: 3px solid var(--border);
}
.kpi-card.neg { border-top-color: var(--red); }
.kpi-card.pos { border-top-color: var(--green); }
.kpi-card.res { border-top-color: var(--teal); }
.kpi-card.count { border-top-color: var(--purple); }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.kpi-value { font-size: 30px; font-weight: 700; color: var(--text); }
.kpi-card.neg .kpi-value { color: var(--red); }
.kpi-card.pos .kpi-value { color: var(--green); }
.kpi-card.res .kpi-value { color: var(--teal); }
.kpi-card.count .kpi-value { color: var(--purple); }
.kpi-sub { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.kpi-change { font-weight: 600; }
.kpi-change.good { color: var(--green); }
.kpi-change.bad { color: var(--red); }
.kpi-change.neutral { color: var(--text-secondary); }

/* TWO-COLUMN LAYOUT: chart + pillars side by side */
.dual-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1200px) { .dual-row { grid-template-columns: 1fr; } }

/* MARKET CHART */
.chart-card { background: var(--card-bg); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.chart-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 14px; }
[data-theme="dark"] .chart-title { color: #7ab8d6; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-label { width: 44px; font-weight: 600; font-size: 12px; text-align: right; }
.bar-track { flex: 1; height: 22px; background: var(--border); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; min-width: 2px; }
.bar-value { font-size: 11px; color: var(--text-secondary); white-space: nowrap; min-width: 90px; }

/* PILLAR CARDS */
.pillars-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 1200px) { .pillars-row { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .pillars-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 400px) { .pillars-row { grid-template-columns: 1fr; } }
.pillar-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); border-bottom: 3px solid var(--border);
  transition: transform .15s, box-shadow .15s;
}
.pillar-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.pillar-header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.pillar-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.pillar-name { font-size: 11px; font-weight: 700; color: var(--text); }
.pillar-share { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
.pillar-count { font-size: 10px; color: var(--text-secondary); margin-bottom: 10px; }
.pillar-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.badge.neg { background: rgba(231,76,60,.12); color: var(--red); }
.badge.pos { background: rgba(39,174,96,.12); color: var(--green); }
.badge.res { background: rgba(22,160,133,.12); color: var(--teal); }

/* TRANSCRIPT TABLES */
.download-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.transcript-section { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
.transcript-header { padding: 12px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background .15s; }
.transcript-header:hover { background: var(--hover-bg); }
.transcript-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.transcript-name { font-weight: 700; font-size: 13px; flex: 1; }
.transcript-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.transcript-count { font-size: 11px; color: var(--text-secondary); }
.transcript-chevron { font-size: 11px; color: var(--text-secondary); transition: transform .2s; }
.transcript-section.expanded .transcript-chevron { transform: rotate(180deg); }
.transcript-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
.transcript-section.expanded .transcript-body { max-height: 800px; overflow-y: auto; }
.transcript-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.transcript-table th { background: var(--table-header); color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0; }
.transcript-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
.transcript-table tr:nth-child(even) td { background: var(--table-row-alt); }
.transcript-table tr:hover td { background: var(--hover-bg); }
.q1-badge { display: inline-block; padding: 2px 7px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.q1-badge.neg { background: rgba(231,76,60,.15); color: var(--red); }
.q1-badge.pos { background: rgba(39,174,96,.15); color: var(--green); }
.q2-badge { display: inline-block; padding: 2px 7px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.q2-badge.yes { background: rgba(39,174,96,.12); color: var(--green); }
.q2-badge.no { background: rgba(122,140,158,.12); color: var(--text-secondary); }
.courier-id { font-family: 'SF Mono', Monaco, monospace; font-size: 10px; color: var(--text-secondary); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q3-text { max-width: 500px; word-wrap: break-word; }

/* COMPARISON TABLE */
.compare-card { background: var(--card-bg); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th { background: var(--table-header); color: #fff; padding: 10px 16px; text-align: left; font-weight: 600; font-size: 12px; }
.compare-table td { padding: 10px 16px; border-bottom: 1px solid var(--border); }
.compare-table tr:hover td { background: var(--hover-bg); }
.compare-table .metric-name { font-weight: 600; }
.compare-arrow { font-size: 11px; }
.compare-arrow.good { color: var(--green); }
.compare-arrow.bad { color: var(--red); }
.compare-arrow.neutral { color: var(--text-secondary); }

/* Q1-ONLY TABLE */
.q1only-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.q1only-header { padding: 12px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.q1only-title { font-size: 13px; font-weight: 700; color: var(--navy); flex: 1; }
[data-theme="dark"] .q1only-title { color: #7ab8d6; }
.q1only-summary { display: flex; gap: 16px; font-size: 12px; }
.q1only-summary .sum-item { display: flex; align-items: center; gap: 4px; }
.q1only-summary .sum-num { font-weight: 700; font-size: 16px; }
.q1only-summary .sum-num.neg { color: var(--red); }
.q1only-summary .sum-num.pos { color: var(--green); }
.q1only-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.q1only-table th { background: var(--table-header); color: #fff; padding: 8px 12px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0; }
.q1only-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
.q1only-table tr:nth-child(even) td { background: var(--table-row-alt); }
.q1only-table tr:hover td { background: var(--hover-bg); }
.q1only-body { max-height: 400px; overflow-y: auto; }

/* Q1 COMPARISON CHARTS */
.q1-compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
@media (max-width: 800px) { .q1-compare-grid { grid-template-columns: 1fr; } }
.q1-compare-card { background: var(--hover-bg); border-radius: 8px; padding: 14px; }
.q1-compare-title { font-size: 11px; font-weight: 700; color: var(--navy); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .3px; }
[data-theme="dark"] .q1-compare-title { color: #7ab8d6; }
.q1-compare-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.q1-compare-bar-label { width: 90px; font-size: 11px; font-weight: 600; text-align: right; }
.q1-compare-bar-track { flex: 1; height: 20px; background: var(--border); border-radius: 4px; overflow: hidden; }
.q1-compare-bar-fill { height: 100%; border-radius: 4px; transition: width .5s; min-width: 2px; }
.q1-compare-bar-val { font-size: 10px; color: var(--text-secondary); min-width: 80px; }
.q1-compare-stat { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.q1-compare-stat:last-child { border-bottom: none; }
.q1-compare-stat-label { font-size: 11px; color: var(--text-secondary); }
.q1-compare-stat-val { font-size: 14px; font-weight: 700; }
.q1-compare-stat-val.neg { color: var(--red); }
.q1-compare-stat-val.pos { color: var(--green); }
.q1-compare-stat-val.neutral { color: var(--text-secondary); }
.q1-donut-wrap { display: flex; align-items: center; gap: 12px; }
.q1-donut { width: 60px; height: 60px; border-radius: 50%; position: relative; flex-shrink: 0; }
.q1-donut::after { content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; border-radius: 50%; background: var(--hover-bg); }
.q1-donut-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 11px; font-weight: 700; z-index: 1; }
.q1-donut-legend { font-size: 11px; line-height: 1.6; }
.q1-donut-legend .leg-neg { color: var(--red); }
.q1-donut-legend .leg-pos { color: var(--green); }
.q1-compare-vs { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; background: var(--card-bg); border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--navy); }
[data-theme="dark"] .q1-compare-vs { color: #7ab8d6; }

/* GLOSSARY */
.glossary-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.glossary-header { padding: 12px 18px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; transition: background .15s; }
.glossary-header:hover { background: var(--hover-bg); }
.glossary-chevron { transition: transform .2s; }
.glossary-card.expanded .glossary-chevron { transform: rotate(180deg); }
.glossary-body { max-height: 0; overflow: hidden; transition: max-height .3s; }
.glossary-card.expanded .glossary-body { max-height: 1000px; }
