name: Courier Feedback Agent

on:
  schedule:
    # Every Monday at 1:00 PM UTC
    # Adjust cron if your timezone differs:
    #   UK (GMT):   0 13 * * 1   <- currently set
    #   UK (BST):   0 12 * * 1   (summer, Apr-Oct)
    #   Canada EST: 0 18 * * 1
    #   Canada EDT: 0 17 * * 1   (summer)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no upload)'
        required: false
        default: 'false'

jobs:
  run-feedback-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl numpy google-auth google-auth-oauthlib google-api-python-client

      - name: Configure Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > /tmp/google_creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/google_creds.json" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          printf "AUTH_METHOD=adc\n" > .env
          printf "DRIVE_FOLDER_ID=${{ secrets.DRIVE_FOLDER_ID }}\n" >> .env
          printf "OUTPUT_FOLDER_ID=${{ secrets.OUTPUT_FOLDER_ID }}\n" >> .env
          printf "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}\n" >> .env
          printf "SLACK_CHANNEL=#courier-feedback-reports\n" >> .env
          printf "SLACK_ALERT_TAG=@here\n" >> .env
          printf "SLACK_ALERT_NEG_PCT=22\n" >> .env

      - name: Run Feedback Agent (full run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python feedback_agent.py --slack

      - name: Run Feedback Agent (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python feedback_agent.py --dry-run

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
