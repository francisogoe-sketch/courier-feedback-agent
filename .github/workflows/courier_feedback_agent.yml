name: Courier Feedback Agent Workflow

on:
  schedule:
    - cron: '0 13 * * 1'
    - cron: '0 17 * * 1'
    - cron: '0 10 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow openpyxl numpy google-auth google-auth-oauthlib google-api-python-client requests

      - name: Configure Google credentials
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_CREDS" > /tmp/google_creds.json
          python3 -c "import json; d=json.load(open('/tmp/google_creds.json')); d['quota_project_id']='pendo-feedback-agent'; json.dump(d,open('/tmp/google_creds.json','w'))"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/google_creds.json" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_PROJECT=pendo-feedback-agent" >> $GITHUB_ENV

      - name: Create env file
        run: |
          printf "AUTH_METHOD=adc\n" > .env
          printf "DRIVE_FOLDER_ID=1Z2ugAbgFYgmErVrM-TTEJYGhcsx0U9Cm\n" >> .env
          printf "OUTPUT_FOLDER_ID=1AJvXVyAi0up23juK1RDQFqc2QoDQ7W-K\n" >> .env
          printf "GOOGLE_CLOUD_PROJECT=pendo-feedback-agent\n" >> .env

      - name: Run Feedback Agent (Fetch from Drive)
        run: |
          python feedback_agent.py

      - name: Update Master Dataset & Safe Parquet Base
        run: |
          python build_master_data.py

      - name: Publish Dashboard to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git pull --rebase origin main
          git add -f data/base/ data/outputs/ weekly_courier_survey_all_data.csv data.json index.html .nojekyll
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "auto: update CSAT base parquet, metrics, and dashboard [skip ci]"
            git push origin main
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
