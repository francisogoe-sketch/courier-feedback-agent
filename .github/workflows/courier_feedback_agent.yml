name: Courier Feedback Agent Workflow

on:
  schedule:
    # Runs automatically every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy openpyxl requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run Feedback Agent (Fetch from Drive)
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python feedback_agent.py

      - name: Update Master Dataset & Append to Base Parquet
        run: |
          python build_master_data.py

      - name: Rebuild Dashboard (Data & HTML)
        run: |
          if [ -f "rebuild_dashboard_DEFINITIVE.py" ]; then
            python rebuild_dashboard_DEFINITIVE.py
          elif [ -f "rebuild_dashboard.py" ]; then
            python rebuild_dashboard.py
          fi

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/base/ data/outputs/ weekly_courier_survey_all_data.csv data.json index.html
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "Auto-append weekly CSAT data & rebuild dashboard [skip ci]"
            git push origin main
          fi
